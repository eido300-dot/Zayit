name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco-check:
    name: Check DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Verify Signed-off-by on all PR commits
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const commits = await github.paginate(
              github.rest.pulls.listCommits,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );

            const signOffRegex = /^Signed-off-by: .+ <.+@.+>$/m;
            const failures = [];
            let skipped = 0;

            for (const c of commits) {
              // Commits nobody here can sign: those of bot accounts (upstream's download-count bot) and
              // the merge commits GitHub itself creates (committed by web-flow) when a pull request is
              // merged on the website.
              const isBot = c.author?.type === "Bot";
              const isGitHubMerge = c.parents.length > 1 && c.committer?.login === "web-flow";
              if (isBot || isGitHubMerge) {
                skipped++;
                continue;
              }
              const message = c.commit.message || "";
              if (!signOffRegex.test(message)) {
                failures.push(`${c.sha.substring(0, 7)} — ${message.split("\n")[0]}`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(
                "The following commits are missing a 'Signed-off-by' line " +
                "(see CONTRIBUTING.md, use `git commit -s`):\n\n" +
                failures.map((f) => `  - ${f}`).join("\n")
              );
            } else {
              core.info(`${commits.length - skipped} commit(s) signed off; ${skipped} bot or GitHub merge commit(s) skipped.`);
            }
